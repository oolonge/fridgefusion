services:
  # PostgreSQL Master (Read-Write)
  postgres-master:
    image: postgres:16-alpine
    container_name: fridgefusion-postgres-master
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: fridgefusion
      # Replication settings
      POSTGRES_HOST_AUTH_METHOD: md5
    volumes:
      - postgres-master-data:/var/lib/postgresql/data
      - ./docker/postgres/master/init.sh:/docker-entrypoint-initdb.d/01-init.sh
      - ./docker/postgres/init-db.sql:/docker-entrypoint-initdb.d/02-init-db.sql
      - ./docker/postgres/master/postgresql.conf:/etc/postgresql/postgresql.conf
      - ./docker/postgres/master/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    ports:
      - "5434:5432"
    networks:
      - fridgefusion-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # PostgreSQL Slave (Read-Only Replica)
  postgres-slave:
    image: postgres:16-alpine
    container_name: fridgefusion-postgres-slave
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-postgres}
      PGDATA: /var/lib/postgresql/data/pgdata
      # Master connection info for replication
      POSTGRES_MASTER_HOST: postgres-master
      POSTGRES_MASTER_PORT: 5432
    volumes:
      - postgres-slave-data:/var/lib/postgresql/data
      - ./docker/postgres/slave/entrypoint.sh:/usr/local/bin/custom-entrypoint.sh
    entrypoint: ["/usr/local/bin/custom-entrypoint.sh"]
    ports:
      - "5435:5432"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend Master Instance (Read-Write, connects to postgres-master)
  backend-master:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-master
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-master.json
    volumes:
      - ./docker/backend/config-master.json:/app/config/config-master.json
      - backend-master-logs:/app/logs
    ports:
      - "8080:8080"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Backend Read-Only Instance 1 (connects to postgres-slave)
  backend-ro1:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-ro1
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-ro1.json
      - API_PORT=8081
    volumes:
      - ./docker/backend/config-ro1.json:/app/config/config-ro1.json
      - backend-ro1-logs:/app/logs
    ports:
      - "8081:8081"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Backend Read-Only Instance 2 (connects to postgres-slave)
  backend-ro2:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-ro2
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-ro2.json
      - API_PORT=8082
    volumes:
      - ./docker/backend/config-ro2.json:/app/config/config-ro2.json
      - backend-ro2-logs:/app/logs
    ports:
      - "8082:8082"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8082/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Mirror - Backend Master Instance for /mirror path
  backend-mirror-master:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-mirror-master
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-mirror-master.json
      - API_PORT=8090
    volumes:
      - ./docker/backend/config-mirror-master.json:/app/config/config-mirror-master.json
      - backend-mirror-master-logs:/app/logs
    ports:
      - "8090:8090"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8090/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Mirror - Backend Read-Only Instance 1
  backend-mirror-ro1:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-mirror-ro1
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-mirror-ro1.json
      - API_PORT=8091
    volumes:
      - ./docker/backend/config-mirror-ro1.json:/app/config/config-mirror-ro1.json
      - backend-mirror-ro1-logs:/app/logs
    ports:
      - "8091:8091"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8091/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Mirror - Backend Read-Only Instance 2
  backend-mirror-ro2:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: fridgefusion-backend-mirror-ro2
    environment:
      - FRIDGEFUSION_CONFIG=/app/config/config-mirror-ro2.json
      - API_PORT=8092
    volumes:
      - ./docker/backend/config-mirror-ro2.json:/app/config/config-mirror-ro2.json
      - backend-mirror-ro2-logs:/app/logs
    ports:
      - "8092:8092"
    networks:
      - fridgefusion-network
    depends_on:
      postgres-slave:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8092/api/v2/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Caddy Web Server (Load Balancer + Reverse Proxy)
  caddy:
    image: caddy:2-alpine
    container_name: fridgefusion-caddy
    volumes:
      - ./docker/caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./web_server:/srv/web_server
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    ports:
      - "9000:8000"
      - "9443:8443"  # HTTPS port
    networks:
      - fridgefusion-network
    depends_on:
      - backend-master
      - backend-ro1
      - backend-ro2
      - backend-mirror-master
      - backend-mirror-ro1
      - backend-mirror-ro2
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:2.9.3
    container_name: fridgefusion-loki
    volumes:
      - ./docker/loki/loki-config.yml:/etc/loki/loki-config.yml
      - loki-data:/loki
    command: -config.file=/etc/loki/loki-config.yml
    ports:
      - "3100:3100"
    networks:
      - fridgefusion-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Promtail - Log Shipper (sends logs to Loki)
  promtail:
    image: grafana/promtail:2.9.3
    container_name: fridgefusion-promtail
    volumes:
      - ./docker/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command: -config.file=/etc/promtail/promtail-config.yml
    networks:
      - fridgefusion-network
    depends_on:
      - loki

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:10.2.3
    container_name: fridgefusion-grafana
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./docker/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml
      - ./docker/grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - fridgefusion-network
    depends_on:
      - loki
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  fridgefusion-network:
    driver: bridge

volumes:
  postgres-master-data:
  postgres-slave-data:
  backend-master-logs:
  backend-ro1-logs:
  backend-ro2-logs:
  backend-mirror-master-logs:
  backend-mirror-ro1-logs:
  backend-mirror-ro2-logs:
  caddy-data:
  caddy-config:
  caddy-logs:
  loki-data:
  grafana-data:
