name: CI

on:
  push:
    branches: [main, feature/*]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Data Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/data-service/docker/Dockerfile
          push: false
          tags: fridgefusion/data-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Core Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/core-service/docker/Dockerfile
          push: false
          tags: fridgefusion/core-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Auth Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/auth-service/docker/Dockerfile
          push: false
          tags: fridgefusion/auth-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build Gateway Service
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/gateway-service/docker/Dockerfile
          push: false
          tags: fridgefusion/gateway-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
