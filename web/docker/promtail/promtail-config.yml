server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      # Only keep fridgefusion containers
      - source_labels: ['__meta_docker_container_name']
        regex: '.*fridgefusion.*'
        action: keep
      # Extract container name as job label
      - source_labels: ['__meta_docker_container_name']
        regex: '/fridgefusion-(.*)'
        target_label: job
      # Add service_type label based on container name
      - source_labels: ['__meta_docker_container_name']
        regex: '.*gateway-service.*'
        replacement: 'gateway'
        target_label: service_type
      - source_labels: ['__meta_docker_container_name']
        regex: '.*auth-service.*'
        replacement: 'auth'
        target_label: service_type
      - source_labels: ['__meta_docker_container_name']
        regex: '.*core-service.*'
        replacement: 'core'
        target_label: service_type
      - source_labels: ['__meta_docker_container_name']
        regex: '.*data-service.*'
        replacement: 'data'
        target_label: service_type
      - source_labels: ['__meta_docker_container_name']
        regex: '.*postgres.*'
        replacement: 'database'
        target_label: service_type
      - source_labels: ['__meta_docker_container_name']
        regex: '.*caddy.*'
        replacement: 'loadbalancer'
        target_label: service_type
      # Add instance number label
      - source_labels: ['__meta_docker_container_name']
        regex: '.*service-([0-9]+)'
        target_label: instance_number
      # Add instance label - mirror for mirror containers
      - source_labels: ['__meta_docker_container_name']
        regex: '.*-mirror-.*'
        replacement: 'mirror'
        target_label: instance
      # Add instance label - main for non-mirror containers (default)
      - source_labels: ['instance']
        regex: '^$'
        replacement: 'main'
        target_label: instance
      # Add environment label
      - replacement: 'production'
        target_label: environment
      # Add container_name label
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container_name
      # Add architecture label for Lab 6
      - replacement: 'microservices'
        target_label: architecture
